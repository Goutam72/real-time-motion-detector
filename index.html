<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motion Detector</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Motion Detector</h1>
        <p class="subtitle">
            Real-time camera movement detection
        </p>

        <div class="camera-box">
            <video id="video" autoplay muted></video>

            <div id="status" class="status">
                Camera Not Started
            </div>
        </div>

        <div class="buttons">
            <button id="startBtn">
                Start Camera
            </button>

            <button id="stopBtn">
                Stop Camera
            </button>
        </div>

        <div class="dashboard">

            <div class="card">
                <h3>Motion Count</h3>
                <p id="motionCount">0</p>
            </div>

            <div class="card">
                <h3>Last Detected</h3>
                <p id="lastDetected">Never</p>
            </div>

            <div class="card">
                <h3>Camera</h3>
                <p id="cameraStatus">OFF</p>
            </div>

        </div>

        <div class="history">

            <h2>Detection History</h2>

            <ul id="historyList">
                <li>No motion detected yet.</li>
            </ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
